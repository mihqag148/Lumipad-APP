name: Build and release LumiPad Windows app

on:
  push:
    branches: [main]
    paths: ['pc-app/**', '.github/workflows/windows-app.yml']
  pull_request:
    paths: ['pc-app/**', '.github/workflows/windows-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumipad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore pc-app/LumiPad.App/LumiPad.App.csproj
      - name: Publish self-contained app
        run: >-
          dotnet publish pc-app/LumiPad.App/LumiPad.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/LumiPad
      - uses: actions/upload-artifact@v4
        with:
          name: LumiPad-Windows-x64
          path: publish/LumiPad/**
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LumiPad-Windows-x64
          path: dist/app
      - name: Package and publish app release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content pc-app/LumiPad.App/LumiPad.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid app Version' }
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; preserved."; exit 0 }
          Compress-Archive -Path dist/app/* -DestinationPath dist/LumiPad-Windows-x64.zip
          @{ version = $version; appVersion = $version; commit = $env:GITHUB_SHA; app = 'LumiPad-Windows-x64.zip' } |
            ConvertTo-Json | Set-Content dist/release-manifest.json -Encoding utf8
          gh release create $tag --target $env:GITHUB_SHA --title "LumiPad $version" --notes 'Standalone LumiPad Windows app for RYNOR ONE and PIXEL PRO. Firmware releases remain in the device repositories.' dist/LumiPad-Windows-x64.zip dist/release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'App release failed' }
